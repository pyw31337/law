<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>렛츠로 (Let's Law) — 법률·판례 인텔리전스 & 대법원 양형 시뮬레이터</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(20, 27, 45, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --accent: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 24px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header {
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    h1 { font-size: 26px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    .badge {
      background: rgba(59, 130, 246, 0.2);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
    }
    h2 { font-size: 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; color: var(--primary); }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
    }
    .checkbox-group { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--muted);
      cursor: pointer;
    }
    .checkbox-label input { cursor: pointer; }
    .result-box {
      margin-top: 20px;
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 10px;
      padding: 16px;
    }
    .result-title { font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
    .result-val { font-size: 22px; font-weight: 800; color: #fff; }
    .case-list { display: flex; flex-direction: column; gap: 14px; max-height: 700px; overflow-y: auto; padding-right: 6px; }
    .case-card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      transition: all 0.2s;
    }
    .case-card:hover { border-color: rgba(59, 130, 246, 0.5); }
    .case-header { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
    .case-no { font-weight: 700; color: var(--primary); }
    .case-court { color: var(--muted); }
    .case-name { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .case-summary { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
    .case-sentence {
      background: rgba(16, 185, 129, 0.1);
      color: var(--accent);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
    }
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.08);
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>⚖️ 렛츠로 (Let's Law) <span class="badge">독립 원장 v1</span></h1>
        <p style="color: var(--muted); font-size: 14px; margin-top: 4px;">대법원 양형기준 가중치 실시간 시뮬레이터 & 25대 헌재·대법원·하급심 리딩 판례 인텔리전스</p>
      </div>
      <input type="text" id="caseSearch" style="width: 300px; padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px; color: #fff;" placeholder="판례 사건번호, 죄명, 쟁점 검색...">
    </header>

    <div class="grid">
      <!-- 좌측: 대법원 양형기준 시뮬레이터 -->
      <div class="card">
        <h2>📊 대법원 양형기준 시뮬레이터</h2>
        
        <div class="form-group">
          <label>주요 범죄 유형 선택</label>
          <select id="crimeSelect">
            <option value="embezzle">특경법상 횡령·배임 (50억원 이상)</option>
            <option value="capital_market">자본시장법상 불공정거래 / 미공개정보 이용</option>
            <option value="election">공직선거법 허위사실공표죄</option>
            <option value="fraud_charter">조직적 무자본 갭투자 전세사기 (특경가법 사기)</option>
            <option value="bribery">청탁금지법 위반 (3,000만원 초과 수수)</option>
            <option value="dui_fatal">특가법상 위험운전치사 / 음주 뺑소니 (윤창호법)</option>
          </select>
        </div>

        <div class="form-group">
          <label>피해 금액 / 수수액 (억원)</label>
          <input type="number" id="crimeAmount" value="78" step="1">
        </div>

        <div class="form-group">
          <label>특별 양형 인자 (가중 / 감경)</label>
          <div class="checkbox-group">
            <label class="checkbox-label"><input type="checkbox" id="f_agg_abuse" checked> 지배권 남용 / 범죄집단 주도 (가중)</label>
            <label class="checkbox-label"><input type="checkbox" id="f_agg_unrecovered" checked> 피해 회복 불능 다액 (가중)</label>
            <label class="checkbox-label"><input type="checkbox" id="f_mit_first"> 동종 전과 없는 초범 (감경)</label>
            <label class="checkbox-label"><input type="checkbox" id="f_mit_settle"> 피해자와 원만한 합의 / 처벌불원 (감경)</label>
            <label class="checkbox-label"><input type="checkbox" id="f_mit_confess"> 수사 초기 자백 및 반성 (감경)</label>
          </div>
        </div>

        <div class="result-box">
          <div class="result-title">대법원 양형위원회 권고 선고형량 시뮬레이션 결과</div>
          <div class="result-val" id="calcResult">징역 6년 ~ 징역 9년 (실형)</div>
          <p id="calcDesc" style="color: var(--muted); font-size: 13px; margin-top: 6px;">가중인자 2개 우세로 기본 영역 상단 돌파, 집행유예 불가 영역 해당</p>
        </div>
      </div>

      <!-- 우측: 25대 리딩 판례 실시간 검색 및 온톨로지 뷰어 -->
      <div class="card">
        <h2>📜 25대 리딩 판례 데이터베이스 (<span id="caseCount">25</span>건)</h2>
        <div class="case-list" id="caseList">
          <p style="color: var(--muted)">판례를 불러오는 중입니다...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let precedents = [];

    async function loadPrecedents() {
      try {
        const res = await fetch('data/precedents_db.json');
        const data = await res.json();
        precedents = data.precedents || [];
        document.getElementById('caseCount').textContent = precedents.length;
        renderCases(precedents);
      } catch (e) {
        document.getElementById('caseList').innerHTML = '<p style="color:#ef4444">판례 원장을 불러오지 못했습니다.</p>';
      }
    }

    function renderCases(list) {
      const el = document.getElementById('caseList');
      if (!list.length) {
        el.innerHTML = '<p style="color: var(--muted)">일치하는 판례가 없습니다.</p>';
        return;
      }
      el.innerHTML = list.map(c => `
        <div class="case-card">
          <div class="case-header">
            <span class="case-no">${c.case_no}</span>
            <span class="case-court">${c.court} (${c.date})</span>
          </div>
          <div class="case-name">${c.case_name}</div>
          <div style="margin-bottom: 6px;">
            <span class="tag">${c.category || '형사'}</span>
            <span class="tag">${c.crime_type || ''}</span>
          </div>
          <div class="case-summary">${c.summary || ''}</div>
          <div class="case-sentence">선고형: ${c.verdict?.sentence || c.sentence || '상세 판결문 참조'}</div>
        </div>
      `).join('');
    }

    // 시뮬레이터 연산 로직
    function updateSimulation() {
      const crime = document.getElementById('crimeSelect').value;
      const amt = parseFloat(document.getElementById('crimeAmount').value) || 0;
      const aggAbuse = document.getElementById('f_agg_abuse').checked;
      const aggUnrec = document.getElementById('f_agg_unrecovered').checked;
      const mitFirst = document.getElementById('f_mit_first').checked;
      const mitSettle = document.getElementById('f_mit_settle').checked;
      const mitConfess = document.getElementById('f_mit_confess').checked;

      let aggScore = (aggAbuse ? 1 : 0) + (aggUnrec ? 1 : 0);
      let mitScore = (mitFirst ? 1 : 0) + (mitSettle ? 2 : 0) + (mitConfess ? 1 : 0);

      let resultText = "";
      let descText = "";

      if (crime === 'embezzle') {
        if (amt >= 50) {
          if (aggScore > mitScore) {
            resultText = "징역 6년 ~ 징역 9년 (실형 권고)";
            descText = "50억원 이상 특경가법 적용, 가중영역 해당으로 집행유예 불가";
          } else if (mitScore >= 2 && !aggUnrec) {
            resultText = "징역 3년 ~ 징역 5년 (집행유예 참작 가능)";
            descText = "피해액 전액 공탁 또는 처벌불원 시 작량감경으로 집행유예 검토 가능";
          } else {
            resultText = "징역 5년 ~ 징역 7년 (기본영역 실형)";
            descText = "기본 형량 구간 내 실형 선고 권고";
          }
        } else {
          resultText = "징역 3년 ~ 징역 6년";
          descText = "5억원 이상 50억원 미만 특경법 기본구간";
        }
      } else if (crime === 'election') {
        if (aggScore > mitScore) {
          resultText = "벌금 300만원 ~ 700만원 (당선무효형)";
          descText = "공직선거법상 100만원 이상 벌금 확정 시 당선무효 및 5년간 피선거권 박탈";
        } else {
          resultText = "벌금 90만원 ~ 150만원 경계선";
          descText = "초범 및 참작 동기 인정 시 100만원 미만 감경 가능성 존재";
        }
      } else if (crime === 'fraud_charter') {
        resultText = "징역 12년 ~ 징역 15년 (법정최고형)";
        descText = "다수 서민 주거안정 파괴 범죄집단 조직 혐의 가중으로 최고형 선고 추세";
      } else {
        resultText = "징역 4년 ~ 징역 7년";
        descText = "대법원 양형기준 가중/감경 인자 종합 산정 권고";
      }

      document.getElementById('calcResult').textContent = resultText;
      document.getElementById('calcDesc').textContent = descText;
    }

    document.querySelectorAll('#crimeSelect, #crimeAmount, input[type="checkbox"]').forEach(el => {
      el.addEventListener('change', updateSimulation);
      el.addEventListener('input', updateSimulation);
    });

    document.getElementById('caseSearch').addEventListener('input', e => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) return renderCases(precedents);
      const filtered = precedents.filter(c => 
        (c.case_no || '').toLowerCase().includes(q) ||
        (c.case_name || '').toLowerCase().includes(q) ||
        (c.summary || '').toLowerCase().includes(q) ||
        (c.crime_type || '').toLowerCase().includes(q)
      );
      renderCases(filtered);
    });

    loadPrecedents();
    updateSimulation();
  </script>
</body>
</html>
