name: 24/7 Daily Legal Cases & Statutes Ingestion

on:
  schedule:
    # 매일 한국시간 오전 04:00 (UTC 19:00)
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Daily Legal Ingest
        run: |
          python3 scripts/daily_legal_collector.py

      - name: Commit & Push Incremental Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto-ingest): 24/7 daily law update $(date -u +'%Y-%m-%d')" && git push origin main)
